[package]
name = "qu-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local, in-process LLM inference for Qu's AI core (feature `llm` on qu-interp) -- loads a small quantized GGUF chat model via `candle` (pure-Rust, no libtorch/llama.cpp C++ toolchain) and runs greedy text generation entirely on-device. See this crate's `lib.rs` module doc comment for the model-choice investigation (why a standard 4-bit GGUF, not the ternary Bonsai model originally proposed) and IMPL.md's dated entry for the full feasibility trail."

[dependencies]
# Pure-Rust GGUF quantized-model runtime -- see `lib.rs`'s own doc comment
# for why `candle`, not `llama-cpp-rs`/`tch` (this repo's whole ethos is
# "cargo build just works," and llama.cpp's cmake/C++ toolchain has been a
# real source of Windows build friction elsewhere in this repo already).
candle-core = "0.11"
candle-nn = "0.11"
# `quantized_llama::ModelWeights` -- the actual GGUF-quantized Llama-family
# forward pass this crate drives.
candle-transformers = "0.11"
# `default-features = false` drops `esaxx_fast` (on by default upstream),
# which pulls in `esaxx-rs`'s C++ build (`esaxx-rs/cpp`) purely for
# UnigramTrainer's suffix-array construction -- this crate only loads and
# runs a pretrained tokenizer (`tokenizers::Tokenizer`, see below), never
# trains one, so esaxx_fast is dead weight here. Musl cross-compilation
# has no `x86_64-linux-musl-g++` on the release runner (musl-tools only
# installs the C compiler, musl-gcc); esaxx-rs without `cpp` needs none.
# Keeping `onig`/`progressbar`, the other two upstream defaults, since
# `onig` affects actual pretokenizer *behavior* (not just training speed)
# and `progressbar` is a real (if cosmetic) download-progress feature.
tokenizers = { version = "0.22", default-features = false, features = ["onig", "progressbar"] }
# `hf-hub` is NOT a dependency here (was, up to 0.3.2) -- 1.0.0 rewrote it
# around an async-by-default `HFClient` (`reqwest`+`hyper`+`tokio`+`futures`
# UNCONDITIONALLY in its Cargo.toml, even with default-features off; the
# `blocking` feature only adds a sync wrapper on top of that same stack, via
# `tokio/rt` -- checked hf-hub 1.0.0's own Cargo.toml before concluding
# this, not guessed). That's exactly the async-runtime weight this crate
# has always deliberately avoided (see `lib.rs`'s module doc comment), and
# it doesn't buy anything this crate needs: `fetch_tokenizer_json` (below)
# already proved a plain `ureq::get` fetches BOTH file classes this crate
# downloads correctly by hand -- the tokenizer file since hf-hub 0.3.2 had
# its own bug there, and per that same investigation the big LFS-tracked
# `.gguf` blob's redirect (a fully-qualified CloudFront URL) was never
# hf-hub-specific to begin with. `lib.rs` now fetches both files the same
# way; hf-hub bought nothing beyond a cache-path convention this crate
# replicates itself via `dirs` below.
ureq = "3"
# Only for `dirs::home_dir()`, to replicate hf-hub's own `$HF_HOME` (else
# `~/.cache/huggingface/hub`) cache-root convention by hand -- see
# `lib.rs`'s `hf_cache_root` doc comment. Tiny, sync, no transitive HTTP or
# runtime dependencies of its own.
dirs = "5"

# Historical note, kept because it's cheap insurance, not because qu-llm
# itself needs it any more: this existed for hf-hub 0.3.2's native-tls ->
# openssl-sys chain. hf-hub is gone from this crate's deps (see the `ureq`
# comment above) and ureq 3's OWN default features are `["rustls",
# "gzip"]` -- checked ureq 3.4.2's Cargo.toml -- so qu-llm's own musl build
# needs no OpenSSL at all any more. Left in place because openssl-sys is
# STILL in this workspace's Cargo.lock, via `tensorflow-sys` -> `curl-sys`
# (the `backend-tensorflow` feature on `qu-interp`, off by default -- see
# that feature's own doc comment) -- so if anyone ever builds this
# workspace for musl WITH that feature on, this is what makes openssl-sys
# vendor instead of failing to find a system OpenSSL. Not verified with a
# real musl+backend-tensorflow build (that feature needs a real libtensorflow
# install to build at all, on any target); if it turns out unnecessary,
# removing it is safe on its own, no coupling to anything above.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
