[workspace]
resolver = "2"
members = [
    "crates/qu-lexer",
    "crates/qu-syntax",
    "crates/qu-interp",
    "crates/qu-cli",
    "crates/qu-llm",
    "crates/qu-xlsx",
    "crates/qu-codec",
    "crates/qu-pdf",
    "crates/qu-ooxml",
    "crates/qu-docx",
    "crates/qu-pptx",
    "crates/qu-image",
    "crates/qu-jupyter",
]

[workspace.package]
version = "0.4.14"
edition = "2021"
license = "Apache-2.0"
description = "Qu — a scientific scripting language (reference engine)"
repository = "https://github.com/kallelay/Qu"

# Dependency-free by design for the M0–M2 core: std only, so it builds
# reproducibly anywhere (and later to wasm32) with no network. Numeric
# crates (faer, rustfft, ndarray-linalg, wgpu) arrive at their milestones.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# umya-spreadsheet 3.1.1 (latest) still depends on zip 8.6.0, which carries the
# zip-cloaking advisory (GHSA-m665, fixed in 9.0.5) and the extract() symlink
# advisories. This vendored copy differs from the published crate in two places only:
# its Cargo.toml (zip "9") and zip_by_name in src/reader/driver.rs (zip 9's
# ZipFile::name() returns a Result). Drop it when upstream moves.
[patch.crates-io]
umya-spreadsheet = { path = "vendor/umya-spreadsheet" }
