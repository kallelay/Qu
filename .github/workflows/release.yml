name: Release

# Builds the `qu` binary for every platform we can honestly support, and
# attaches them to a GitHub release.
#
# Triggered by pushing a tag (`v0.2.0`), or by hand from the Actions tab
# with `workflow_dispatch` for a dry run that builds without publishing.
#
# Not covered, and why:
#
#   iPadOS / iOS  There is no way to ship this as a normal application.
#                 iOS has no terminal and no subprocesses, and the App
#                 Store rules on executable code mean an interpreter has
#                 to be embedded in an app rather than installed. The
#                 realistic route is a browser build, which needs the
#                 INTERPRETER compiled to wasm32 -- `qu-wasm` today wraps
#                 only the numeric core, and `serialport` and the
#                 filesystem builtins would need feature-gating first.
#                 Tracked, not solved.
#
#   Android       Same reasoning, minus the store restriction. A Termux
#                 build of the Linux aarch64 binary works today for anyone
#                 who wants it.
#
#   macOS Intel   Dropped 2026-09-18. The `macos-13` hosted runner never
#                 got scheduled -- not slow, just never assigned a runner,
#                 across every release run since 2026-09-17 (both the
#                 3+-hour queue incident and every attempt after). Because
#                 `publish`/`studio` both `needs: build`, and a matrix job
#                 only finishes once every leg reaches a terminal state, a
#                 permanently-queued leg blocked the entire pipeline --
#                 that's why no release had ever published. `allow-failure`
#                 and `timeout-minutes` don't help a leg that never leaves
#                 `queued`: the timeout clock only starts once a job is
#                 actually running. Apple Silicon (`macos-arm64` below)
#                 covers current Macs; revisit Intel with a paid/larger
#                 runner if there's real demand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The optional features pull in libtorch, TensorFlow and a GPU stack.
  # A release binary is the default build: portable, no system libraries
  # beyond a C toolchain.
  CARGO_PROFILE_RELEASE_LTO: "thin"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Reads matrix.allow-failure per entry -- see the linux-x86_64-static
    # comment below for why one leg needs this and the others don't.
    continue-on-error: ${{ matrix.allow-failure || false }}
    # Safety net for a leg that starts running but hangs or runs long --
    # NOT a fix for a leg stuck in `queued` (see the macOS Intel note up
    # top for why that distinction mattered here). 40 min covers every
    # leg's real build time with margin (the slowest so far,
    # windows-x86_64, took ~17 min).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip

          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar
            deb: true

          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
            deb: true

          # Statically linked against musl, so it runs on any Linux
          # regardless of glibc version -- the answer for "other Linux",
          # including Alpine and older enterprise distributions.
          #
          # continue-on-error: native-tls (pulled in via hf-hub, for the
          # LLM feature's model downloads) needs a system OpenSSL, and
          # musl cross-compilation has none available on the runner --
          # openssl-sys would need to be forced into vendored/build-from-
          # source mode to fix this for real. This is a bonus fallback
          # target, not one of the primary platforms, so a failure here
          # must not block `publish`/`studio` (both `needs: build`, and a
          # matrix job's overall conclusion is failure if ANY leg fails,
          # fail-fast:false notwithstanding -- that flag only stops
          # siblings being cancelled early, it doesn't change the parent
          # job's own success/failure).
          - name: linux-x86_64-static
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar
            allow-failure: true

          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `serialport` needs libudev on Linux; musl needs the cross linker.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path engine/Cargo.toml

      - name: Smoke test
        shell: bash
        run: |
          BIN="engine/target/${{ matrix.target }}/release/qu"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          # Cross-built binaries cannot run on the builder; only test native.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && [ "${{ runner.arch }}" != "ARM64" ]; then
            echo "cross-built, skipping run"
          else
            echo 'print("ok {1 + 1}")' > smoke.qu
            "$BIN" run smoke.qu
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="dev"
          DIR="qu-${VERSION}-${{ matrix.name }}"
          mkdir -p "$DIR"
          BIN="engine/target/${{ matrix.target }}/release/qu"
          if [ -f "$BIN.exe" ]; then cp "$BIN.exe" "$DIR/"; else cp "$BIN" "$DIR/"; fi
          cp README.md LICENSE NOTICE CHANGELOG.md "$DIR/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$DIR.zip" "$DIR"
          else
            tar czf "$DIR.tar.gz" "$DIR"
          fi

      - name: Build .deb
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} \
            --manifest-path engine/crates/qu-cli/Cargo.toml \
            --output "qu-${GITHUB_REF_NAME#v}-${{ matrix.name }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            qu-*.zip
            qu-*.tar.gz
            qu-*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: CHANGELOG.md
          draft: true
          generate_release_notes: true

  studio:
    name: Qu Studio (${{ matrix.name }})
    # Runs after `publish` so the draft release already exists -- this
    # job uploads its installers into that SAME release (softprops's
    # action matches by tag and adds assets, it doesn't create a second
    # release) rather than each job racing to create its own.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - name: macos-universal
            os: macos-14
            # Tauri builds a universal (arm64 + x86_64) macOS bundle when
            # given both targets, rather than one job per architecture.
            target: aarch64-apple-darwin,x86_64-apple-darwin

          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qu-studio-tauri/package-lock.json

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libudev/pkg-config for the engine's serialport dependency;
        # the webkit2gtk/appindicator/etc. set is what Tauri itself
        # needs to build and bundle on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      # Qu Studio bundles its own `qu` binary as a Tauri "sidecar" --
      # tauri.conf.json's externalBin expects it at
      # binaries/qu-<target-triple>(.exe), built from the SAME commit,
      # not a downloaded artifact from the `build` job (different
      # jobs don't share a filesystem, and this keeps the sidecar's
      # provenance simple: built here, from this checkout).
      - name: Build the qu engine (sidecar)
        shell: bash
        run: |
          set -e
          for T in $(echo "${{ matrix.target }}" | tr ',' ' '); do
            cargo build --release --locked --target "$T" --manifest-path engine/Cargo.toml
            mkdir -p qu-studio-tauri/src-tauri/binaries
            SRC="engine/target/$T/release/qu"
            [ -f "$SRC.exe" ] && SRC="$SRC.exe"
            DST="qu-studio-tauri/src-tauri/binaries/qu-$T"
            [ -f "$SRC" ] && [[ "$SRC" == *.exe ]] && DST="$DST.exe"
            cp "$SRC" "$DST"
          done

      - name: Install frontend dependencies
        working-directory: qu-studio-tauri
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: qu-studio-tauri
          # Attach to the same tag's (already-created, draft) release
          # instead of tauri-action's own release-management flow.
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}
