name: Release

# Builds the `qu` binary for every platform we can honestly support, and
# attaches them to a GitHub release.
#
# Triggered by pushing a tag (`v0.2.0`), or by hand from the Actions tab
# with `workflow_dispatch`: with no `tag` input that is a dry run that
# builds without publishing; with `tag` (e.g. `v0.4.4`) it publishes that
# release at the dispatched commit, and the release step creates the tag --
# for when a tag cannot be pushed from where the release is started.
#
# Not covered, and why:
#
#   iPadOS / iOS  There is no way to ship this as a normal application.
#                 iOS has no terminal and no subprocesses, and the App
#                 Store rules on executable code mean an interpreter has
#                 to be embedded in an app rather than installed. The
#                 realistic route is a browser build, which needs the
#                 INTERPRETER compiled to wasm32 -- `qu-wasm` today wraps
#                 only the numeric core, and `serialport` and the
#                 filesystem builtins would need feature-gating first.
#                 Tracked, not solved.
#
#   Android       Same reasoning, minus the store restriction. A Termux
#                 build of the Linux aarch64 binary works today for anyone
#                 who wants it.
#
#   macOS Intel   Dropped 2026-09-18. The `macos-13` hosted runner never
#                 got scheduled -- not slow, just never assigned a runner,
#                 across every release run since 2026-09-17 (both the
#                 3+-hour queue incident and every attempt after). Because
#                 `publish`/`studio` both `needs: build`, and a matrix job
#                 only finishes once every leg reaches a terminal state, a
#                 permanently-queued leg blocked the entire pipeline --
#                 that's why no release had ever published. `allow-failure`
#                 and `timeout-minutes` don't help a leg that never leaves
#                 `queued`: the timeout clock only starts once a job is
#                 actually running. Apple Silicon (`macos-arm64` below)
#                 covers current Macs; revisit Intel with a paid/larger
#                 runner if there's real demand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish at this commit (e.g. v0.4.4); empty = dry run"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The release's tag: the pushed tag, or the `tag` input of a manual run
  # (for a dry run, the branch name, as before).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # The optional features pull in libtorch, TensorFlow and a GPU stack.
  # A release binary is the default build: portable, no system libraries
  # beyond a C toolchain.
  CARGO_PROFILE_RELEASE_LTO: "thin"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Reads matrix.allow-failure per entry -- see the linux-x86_64-static
    # comment below for why one leg needs this and the others don't.
    continue-on-error: ${{ matrix.allow-failure || false }}
    # Safety net for a leg that starts running but hangs or runs long --
    # NOT a fix for a leg stuck in `queued` (see the macOS Intel note up
    # top for why that distinction mattered here). 40 min covers every
    # leg's real build time with margin (the slowest so far,
    # windows-x86_64, took ~17 min).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip

          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar
            deb: true

          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar
            deb: true

          # Statically linked against musl, so it runs on any Linux
          # regardless of glibc version -- the answer for "other Linux",
          # including Alpine and older enterprise distributions.
          #
          # continue-on-error: native-tls (pulled in via hf-hub, for the
          # LLM feature's model downloads) needs a system OpenSSL, and
          # musl cross-compilation has none available on the runner --
          # openssl-sys would need to be forced into vendored/build-from-
          # source mode to fix this for real. This is a bonus fallback
          # target, not one of the primary platforms, so a failure here
          # must not block `publish`/`studio` (both `needs: build`, and a
          # matrix job's overall conclusion is failure if ANY leg fails,
          # fail-fast:false notwithstanding -- that flag only stops
          # siblings being cancelled early, it doesn't change the parent
          # job's own success/failure).
          - name: linux-x86_64-static
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar
            allow-failure: true

          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `serialport` needs libudev on Linux; musl needs the cross linker.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path engine/Cargo.toml

      - name: Smoke test
        shell: bash
        run: |
          BIN="engine/target/${{ matrix.target }}/release/qu"
          [ -f "$BIN" ] || BIN="$BIN.exe"
          # Cross-built binaries cannot run on the builder; only test native.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && [ "${{ runner.arch }}" != "ARM64" ]; then
            echo "cross-built, skipping run"
          else
            echo 'print("ok {1 + 1}")' > smoke.qu
            "$BIN" run smoke.qu
          fi

      - name: Package
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          [ -n "$VERSION" ] || VERSION="dev"
          DIR="qu-${VERSION}-${{ matrix.name }}"
          mkdir -p "$DIR"
          BIN="engine/target/${{ matrix.target }}/release/qu"
          if [ -f "$BIN.exe" ]; then cp "$BIN.exe" "$DIR/"; else cp "$BIN" "$DIR/"; fi
          # The Jupyter kernel (`qu-jupyter install` registers it), the
          # documentation site for offline use, and the editor plugins --
          # in every archive, and the optional components of the Windows
          # installer below.
          JUP="engine/target/${{ matrix.target }}/release/qu-jupyter"
          if [ -f "$JUP.exe" ]; then cp "$JUP.exe" "$DIR/"; else cp "$JUP" "$DIR/"; fi
          cp -r website "$DIR/docs"
          cp -r editors "$DIR/editors"
          cp README.md LICENSE NOTICE CHANGELOG.md "$DIR/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$DIR.zip" "$DIR"
          else
            tar czf "$DIR.tar.gz" "$DIR"
          fi

      # Windows legs only: an NSIS installer for the same qu.exe, published
      # next to the zip as qu-<ver>-windows-<arch>-setup.exe. It puts `qu`
      # on the PATH (per-user by default). Script and PATH logic live in
      # installer/windows/; end-to-end checks in installer-verify-cli.yml.
      # continue-on-error: an installer problem must not hold back the zip,
      # which the release has always shipped -- the missing setup.exe then
      # shows as this step's failure annotation.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "$env:RELEASE_TAG" -replace '^v', ''
          if (-not $version) { $version = 'dev' }
          $arch = '${{ matrix.name }}' -replace '^windows-', ''
          $src = Join-Path $PWD "qu-$version-${{ matrix.name }}"
          if (-not (Test-Path "$src\qu.exe")) { throw "no $src\qu.exe -- did Package change?" }

          # String-only tests of the PATH logic the installer runs.
          & powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\tests\path-logic.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'path-logic tests failed' }

          function Find-Makensis {
            $c = Get-Command makensis -ErrorAction SilentlyContinue
            if ($c) { return $c.Source }
            foreach ($p in "${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") {
              if ($p -and (Test-Path $p)) { return $p }
            }
            return $null
          }
          $mk = Find-Makensis
          if (-not $mk) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install nsis failed' }
            $mk = Find-Makensis
          }
          if (-not $mk) { throw 'makensis not found' }
          & $mk -VERSION
          & $mk -WX "-DVERSION=$version" "-DARCH=$arch" "-DSRCDIR=$src" "-DOUTDIR=$PWD" installer\windows\qu.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          Get-ChildItem "qu-$version-windows-$arch-setup.exe"

      - name: Build .deb
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} \
            --manifest-path engine/crates/qu-cli/Cargo.toml \
            --output "qu-${RELEASE_TAG#v}-${{ matrix.name }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            qu-*.zip
            qu-*.tar.gz
            qu-*.deb
            qu-*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    # id-token + attestations: build provenance and the keyless checksum
    # signature below. Both steps are continue-on-error, so a signing outage
    # can never hold back a release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The Windows installer build is continue-on-error so a packaging bug
      # cannot hold back the zip, but the download page and quickstart say
      # the installer exists. Fail here, loudly, if either one is missing,
      # instead of publishing a release that silently lacks it.
      - name: Require the Windows installers
        run: |
          missing=0
          for arch in x86_64 arm64; do
            if ! ls dist/qu-*-windows-${arch}-setup.exe >/dev/null 2>&1; then
              echo "::error::no qu-*-windows-${arch}-setup.exe in the build artifacts"
              missing=1
            fi
          done
          exit $missing

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Where each file came from, signed by GitHub: anyone can check that a
      # download was built by THIS repository's workflow from THIS commit
      # (`gh attestation verify <file> --repo kallelay/Qu`). This is not a
      # code-signing certificate (Windows SmartScreen and antivirus do not
      # read it) but it is free, automatic and independently checkable.
      - name: Build provenance attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      # A keyless Sigstore signature over SHA256SUMS (the identity is this
      # workflow, recorded in the public transparency log); verify with
      #   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
      #     --certificate-identity-regexp 'https://github.com/kallelay/Qu/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@v3
      - name: Sign the checksums (keyless)
        continue-on-error: true
        run: |
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          ls -l SHA256SUMS.sigstore.json

      # The release body is the CHANGELOG from this version's `## [x.y.z]`
      # heading down to the previous release tag's heading -- every version
      # since the last published release, not the whole file. The whole
      # file only when the tag has no section (e.g. a workflow_dispatch run).
      - name: Release notes
        run: |
          ver="${RELEASE_TAG#v}"
          git fetch --tags --quiet origin || true
          prev="$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$ver" | head -1)"
          prev="${prev#v}"
          awk -v v="$ver" -v p="$prev" '
            index($0, "## [" v "]") == 1 { on = 1 }
            on && p != "" && index($0, "## [" p "]") == 1 { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then cp CHANGELOG.md RELEASE_NOTES.md; fi
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: RELEASE_NOTES.md
          draft: true
          generate_release_notes: true

  studio:
    name: Qu Studio (${{ matrix.name }})
    # Runs after `publish` so the draft release already exists -- this
    # job uploads its installers into that SAME release (softprops's
    # action matches by tag and adds assets, it doesn't create a second
    # release) rather than each job racing to create its own.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: ${{ matrix.os }}
    # id-token + attestations for the provenance step at the end of the job.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          - name: macos-universal
            os: macos-14
            # Tauri builds a universal (arm64 + x86_64) macOS bundle when
            # given both targets, rather than one job per architecture.
            target: aarch64-apple-darwin,x86_64-apple-darwin

          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: qu-studio-tauri/package-lock.json

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # libudev/pkg-config for the engine's serialport dependency;
        # the webkit2gtk/appindicator/etc. set is what Tauri itself
        # needs to build and bundle on Linux.
        #
        # libwebkit2gtk-4.0-dev, not just -4.1: this is Tauri v1
        # (tauri-apps/tauri-action@v0), whose `webkit2gtk` crate links
        # against the 4.0 line -- 4.1 is what Tauri v2 needs. Without
        # 4.0, `soup2-sys`'s build script fails outright (no
        # `libsoup-2.4.pc` on the system, since that's a transitive
        # dependency of 4.0, not 4.1). Confirmed by the v0.2.3 release
        # run's Linux Studio job on 2026-09-18. Keeping 4.1 installed
        # alongside in case anything else already depends on it.
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev

      # Qu Studio bundles its own `qu` binary as a Tauri "sidecar" --
      # tauri.conf.json's externalBin expects it at
      # binaries/qu-<target-triple>(.exe), built from the SAME commit,
      # not a downloaded artifact from the `build` job (different
      # jobs don't share a filesystem, and this keeps the sidecar's
      # provenance simple: built here, from this checkout).
      - name: Build the qu engine (sidecar)
        shell: bash
        run: |
          set -e
          ARCH_BINS=()
          for T in $(echo "${{ matrix.target }}" | tr ',' ' '); do
            cargo build --release --locked --target "$T" --manifest-path engine/Cargo.toml
            mkdir -p qu-studio-tauri/src-tauri/binaries
            SRC="engine/target/$T/release/qu"
            [ -f "$SRC.exe" ] && SRC="$SRC.exe"
            DST="qu-studio-tauri/src-tauri/binaries/qu-$T"
            [ -f "$SRC" ] && [[ "$SRC" == *.exe ]] && DST="$DST.exe"
            cp "$SRC" "$DST"
            ARCH_BINS+=("$DST")
          done
          # macOS universal build (matrix.target has TWO comma-separated
          # triples): Tauri's own cargo build multi-arch-merges the APP
          # binary automatically for `--target universal-apple-darwin`,
          # but externalBin sidecars are plain files copied in, not part
          # of that cargo build -- Tauri can't lipo something it didn't
          # compile. It looks for one binary already named
          # `qu-universal-apple-darwin`, and errors "Failed to copy
          # external binaries" when only the two arch-suffixed ones
          # exist (confirmed: this exact error, this exact step, tag
          # v0.2.3's actual run). `lipo` ships on every macOS runner.
          if [ "${#ARCH_BINS[@]}" -eq 2 ]; then
            lipo -create "${ARCH_BINS[@]}" \
              -output qu-studio-tauri/src-tauri/binaries/qu-universal-apple-darwin
          fi
          # Windows: the Studio installer's optional components (Jupyter
          # kernel, offline docs) read their payload from here at build
          # time -- see installer.nsi's QU ADDITIONS.
          if [ "$RUNNER_OS" = "Windows" ]; then
            X="$RUNNER_TEMP/qu-studio-extras"
            mkdir -p "$X"
            cp "engine/target/${{ matrix.target }}/release/qu-jupyter.exe" "$X/"
            cp installer/windows/qu-jupyter-start.cmd installer/windows/path-helper.ps1 "$X/"
            cp -r website "$X/docs"
            echo "QU_STUDIO_EXTRAS=$(cygpath -w "$X")" >> "$GITHUB_ENV"
          fi

      # qu-studio-tauri's own `postinstall` (`npm install --prefix
      # ../qu-ui-components`) runs a SECOND npm process nested inside this
      # one. On windows-latest that nested install hit a real failure: a
      # Windows-only EPERM on rmdir mid-reinstall (large tree, thousands of
      # small files under monaco-editor/@maplibre -- looks like AV/file-lock
      # contention, not a logic bug), which npm retried into a runaway loop
      # that eventually corrupted its own subprocess's PATH ("'npm' is not
      # recognized"). Installing both packages explicitly and sequentially
      # here, with `--ignore-scripts` on the second so the postinstall
      # doesn't ALSO try to redo the first one nested inside itself, avoids
      # the nested-npm-under-load scenario entirely rather than hoping the
      # flakiness doesn't recur. `ci` (not `install`) for both -- both now
      # have committed lockfiles, so this is also the more deterministic
      # install besides.
      # A second, independent diagnosis of the SAME v0.2.3 Windows failure
      # (qumaster's `8a7cec20`-era fix, reconciled here rather than
      # overridden) found the same root cause -- npm's postinstall-nested
      # reinstall hitting a transient `EPERM: ... rmdir` under
      # monaco-editor/maplibre, something else (Defender, the indexer)
      # holding a handle for a moment -- and fixed it with a 3-attempt
      # retry. That retry is real insurance against ANY transient
      # Windows file-lock flakiness here, nesting or not, so it stays.
      # Splitting into two explicit `--prefix` installs (below) removes
      # the nested-npm-nested-process pattern itself, which halves the
      # file-write volume this step does (qu-ui-components no longer
      # gets installed twice -- once explicitly, once again via
      # postinstall) and is the more likely actual reduction in how
      # often the transient lock gets hit in the first place. Belt and
      # suspenders: fewer retries needed, and a safety net if one is.
      - name: Install frontend dependencies
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            if npm ci --prefix qu-ui-components && npm ci --prefix qu-studio-tauri --ignore-scripts; then
              exit 0
            fi
            echo "install failed (attempt $attempt/3) -- retrying after a moment"
            sleep 10
          done
          echo "install failed 3 times" >&2
          exit 1

      # Render the built frontend before packaging it: an installer whose UI
      # crashes at mount (0.4.4: a blank window) must not reach a release.
      # One leg is enough -- the bundle is the same on every platform.
      - name: Smoke-render the frontend
        if: runner.os == 'Linux'
        working-directory: qu-studio-tauri
        run: |
          npx vite build
          npm install --no-save --no-audit --no-fund playwright@1.56
          npx playwright install --with-deps chromium
          node scripts/smoke-render.mjs

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: qu-studio-tauri
          # Attach to the same tag's (already-created, draft) release
          # instead of tauri-action's own release-management flow.
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}

      # The Studio installers are uploaded by tauri-action, after `publish`
      # computed SHA256SUMS, so they are covered here instead: GitHub build
      # provenance for each file, and a SHA256SUMS-studio-<leg> asset. Every
      # step is continue-on-error: a failure here never costs a release.
      - name: List the Studio bundles
        id: bundles
        continue-on-error: true
        shell: bash
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "$PATHS" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const files = JSON.parse(s || "[]").filter(f => !/\.(sig|json)$/.test(f));
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT,
                "list<<EOF\n" + files.join("\n") + "\nEOF\n");
              console.log(files.join("\n"));
            });'
      - name: Provenance for the Studio bundles
        if: steps.bundles.outputs.list != ''
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.bundles.outputs.list }}
      - name: Checksums for the Studio bundles
        if: steps.bundles.outputs.list != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIST: ${{ steps.bundles.outputs.list }}
        run: |
          out="SHA256SUMS-studio-${{ matrix.name }}"
          : > "$out"
          while IFS= read -r f; do
            [ -n "$f" ] && ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> "$out"
          done <<< "$LIST"
          cat "$out"
          gh release upload "$RELEASE_TAG" "$out" --clobber --repo "$GITHUB_REPOSITORY"
