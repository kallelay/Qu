version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/qu-studio-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      studio-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
