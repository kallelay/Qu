[book]
title = "Qu Programming Language"
description = "The Qu book: getting started, language reference, and standard library reference for the Qu scientific scripting language."
authors = ["The Qu project"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "/"
no-section-label = false
additional-js = ["theme/qu-highlight.js"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false

[build]
create-missing = false
