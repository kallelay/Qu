[package]
name = "qu-ui-components-pyqt"
version = "0.1.0"
description = "Modern UI components for MattyStudio IDE (PyQt/PySide)"
authors = ["Qu Language Team"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"

[dependencies]
PyQt6 = "^6.6.0"
pyqtgraph = "^0.13.0"
QScintilla = "^2.14.0"
numpy = "^1.26.0"
pandas = "^2.1.0"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/kallelay/Qu"
Repository = "https://github.com/kallelay/Qu/tree/main/qu-ui-components"
